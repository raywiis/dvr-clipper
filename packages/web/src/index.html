<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPV Clipper</title>
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body>
    <video-player></video-player>

    <file-list class="filelist"></file-list>

    <button id="extract-all-clips" type="button" class="extract-all">
      Extract clips from all videos
    </button>

    <div class="dropzone">
      <div>Drop your DVR footage here</div>
      <div class="dropzone-hint">
        or click to browse &middot; .avi, .mov, .mp4
      </div>
      <div class="dropzone-error" id="dropzone-error"></div>
      <input
        type="file"
        name="dropzone"
        accept=".avi,.mov,.mp4,video/*"
        multiple
      />
    </div>

    <script src="./index.ts" type="module"></script>
  </body>
</html>
