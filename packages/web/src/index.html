<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPV Clipper</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>

  <div class="timeline">
  </div>
  <canvas></canvas>

  <div class="dropzone">
    <div>Drop your DVR footage here</div>

    <div class="dropzone-error" id="dropzone-error"></div>
    <input type="file" name="dropzone" accept=".avi,.mov,.mp4,video/*" multiple>
  </div>

  <script src="./index.ts" type="module"></script>
</body>
</html>
