<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPV Clipper</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>

  <div class="player">
    <div class="stage">
      <canvas></canvas>
      <svg class="timeline-noise" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" hidden></svg>
    </div>
    <div class="timeline">
      <div class="timeline-controls">
        <button type="button" class="play-button" aria-label="Play" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="icon-play" d="M8 5v14l11-7z"></path>
            <rect class="icon-pause" x="6" y="5" width="4" height="14"></rect>
            <rect class="icon-pause" x="14" y="5" width="4" height="14"></rect>
          </svg>
        </button>
        <input type="range" class="timeline-scrub" min="0" max="0" step="any" value="0" disabled>
      </div>
      <span class="timeline-time">0:00 / 0:00</span>
    </div>
  </div>

  <ul class="filelist" hidden></ul>

  <div class="dropzone">
    <div>Drop your DVR footage here</div>
    <div class="dropzone-hint">or click to browse &middot; .avi, .mov, .mp4</div>
    <div class="dropzone-error" id="dropzone-error"></div>
    <input type="file" name="dropzone" accept=".avi,.mov,.mp4,video/*" multiple>
  </div>

  <script src="./index.ts" type="module"></script>
</body>
</html>
